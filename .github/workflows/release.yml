name: "Release Cyberdeck Player"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # WINDOWS 11 (.exe / .msi) BUILD
  # --------------------------------------------------------------------------
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate icon.ico
        shell: pwsh
        run: magick src-tauri/icons/icon.png -define icon:auto-resize=256,128,64,48,32,16 src-tauri/icons/icon.ico

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CYBERDECK // SNAKE NATION ${{ github.ref_name }}'
          releaseBody: 'Official Cyberdeck Snake Nation release for Windows 11.'
          releaseDraft: false
          prerelease: false
